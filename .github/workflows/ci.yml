name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [10.x, 12.x, 14.x, 16.x, 18.x, 20.x]
        # Test on multiple Node.js versions starting from 10.x

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: |
          test-results/
          coverage/
        retention-days: 30

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check for syntax errors
      run: |
        echo "Checking JavaScript files for syntax errors..."
        find . -name "*.js" -not -path "./node_modules/*" -not -path "./tests/fixtures/*" | while read file; do
          node -c "$file" || exit 1
        done
        echo "All JavaScript files are syntactically valid"

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Check for known vulnerabilities
      run: |
        echo "Running npm audit..."
        npm audit --json > audit-results.json || true

    - name: Upload audit results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-audit-results
        path: audit-results.json
        retention-days: 30

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify CLI executable
      run: |
        chmod +x ./cli/cli.js
        ./cli/cli.js --version || echo "CLI version command not available"
        ./cli/cli.js --help || echo "CLI help command not available"

    - name: Run all tests one final time
      run: npm test

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install nyc for coverage
      run: npm install --save-dev nyc

    - name: Run tests with coverage
      run: npx nyc --reporter=text --reporter=lcov npm test
      continue-on-error: true

    - name: Generate coverage report
      run: |
        if [ -f coverage/lcov.info ]; then
          echo "Coverage report generated"
          npx nyc report --reporter=text-summary
        else
          echo "No coverage data generated"
        fi
      continue-on-error: true

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [test, lint, security, build, coverage]
    if: always()

    steps:
    - name: Check CI status
      run: |
        echo "Test job status: ${{ needs.test.result }}"
        echo "Lint job status: ${{ needs.lint.result }}"
        echo "Security job status: ${{ needs.security.result }}"
        echo "Build job status: ${{ needs.build.result }}"
        echo "Coverage job status: ${{ needs.coverage.result }}"

        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "❌ Tests failed"
          exit 1
        fi

        if [ "${{ needs.lint.result }}" != "success" ]; then
          echo "❌ Linting failed"
          exit 1
        fi

        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "❌ Build verification failed"
          exit 1
        fi

        echo "✅ All required CI checks passed"
